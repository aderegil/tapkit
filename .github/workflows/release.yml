# When you publish a GitHub release, build one zip per skill and attach them all.
# The README links use releases/latest/download/<skill>.zip, so every release carries every skill.
name: Release zips
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  zips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check shared files
        run: python3 tools/sync_shared.py --check
      - name: Build zips
        run: python3 tools/package_skills.py
      - name: Attach zips to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.zip --clobber
